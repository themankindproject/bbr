name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guard: the tag, Cargo.toml version and CHANGELOG must agree, otherwise a
  # mistagged release ships assets whose embedded version contradicts the tag
  # and `bbr update` loops forever on it.
  verify-version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Check tag == Cargo.toml == CHANGELOG
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag version=$version"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match Cargo.toml version ${version}"
            exit 1
          fi
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' heading"
            exit 1
          fi

  # Guard: the build matrix here is the single source of truth for published
  # asset names. `src/commands/update.rs` (target_candidates) and `install.sh`
  # must be able to name every one of them. Asset naming convention:
  #   bbr-<target>.tar.gz  (unix)   bbr-<target>.zip  (windows)
  verify-matrix:
    name: Verify targets are known to the client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every matrix target must appear in update.rs / install.sh
        run: |
          set -euo pipefail
          targets="$(grep -oP 'target:\s*\K[a-z0-9_]+-[a-z0-9_-]+' .github/workflows/release.yml | sort -u)"
          echo "matrix targets:"; echo "$targets"
          missing=0
          for t in $targets; do
            if ! grep -q "\"${t}\"" src/commands/update.rs; then
              echo "::error::target ${t} is in release.yml but not in src/commands/update.rs"
              missing=1
            fi
          done
          # musl + gnu for both Linux arches, plus macOS and Windows.
          for required in \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc
          do
            if ! echo "$targets" | grep -qx "$required"; then
              echo "::error::release.yml is missing required target ${required}"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds. Pinned to 22.04 so the glibc floor stays 2.35
          # (Ubuntu 22.04, Debian 12, RHEL 9, Amazon Linux 2023 all run it).
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu,   archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          # Fully-static musl builds: no glibc floor at all, so they also run
          # on Alpine. These are what the client prefers on Linux.
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-musl,  archive: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, archive: tar.gz, musl: true }
          - { os: macos-15-intel,  target: x86_64-apple-darwin,        archive: tar.gz }
          - { os: macos-14,        target: aarch64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,     archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # musl needs a C compiler for `ring` (rustls' crypto backend). Only the
      # C compiler is musl-gcc: linking must stay with rustc's self-contained
      # musl. Linking through musl-gcc pulls in the distro's libc.a, which does
      # not match the musl that Rust's std was built against, and the result
      # segfaults on startup (v0.3.0's x86_64 build exited 139 on `--version`).
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke-test the built binary
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="./target/${{ matrix.target }}/release/bbr.exe"
          else
            BIN="./target/${{ matrix.target }}/release/bbr"
          fi
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bbr dist/
          cp README.md LICENSE dist/
          tar -czf bbr-${{ matrix.target }}.tar.gz -C dist .
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bbr.exe dist/
          Copy-Item -Path README.md, LICENSE -Destination dist/
          Compress-Archive dist/* bbr-${{ matrix.target }}.zip

      - name: Verify archive contents and name
        shell: bash
        run: |
          set -euo pipefail
          asset="bbr-${{ matrix.target }}.${{ matrix.archive }}"
          test -f "$asset" || { echo "::error::missing $asset"; exit 1; }
          # Capture the listing first: `tar | grep -q` under pipefail fails
          # spuriously when grep exits before tar finishes writing (SIGPIPE).
          if [ "${{ matrix.archive }}" = "zip" ]; then
            listing="$(unzip -l "$asset")"
            grep -q 'bbr\.exe' <<<"$listing" || { echo "::error::$asset has no bbr.exe"; exit 1; }
          else
            listing="$(tar -tzf "$asset")"
            grep -qE '(^|/)bbr$' <<<"$listing" || { echo "::error::$asset has no bbr binary"; exit 1; }
          fi

      # Per-asset checksum, produced in the same leg that built the artifact so
      # a workflow_dispatch release still ships verifiable downloads.
      - name: Write per-asset checksum
        shell: bash
        run: |
          asset="bbr-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - name: Generate shell completions
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="./target/${{ matrix.target }}/release/bbr.exe"
          else
            BIN="./target/${{ matrix.target }}/release/bbr"
          fi
          $BIN completion bash > bbr.bash
          $BIN completion zsh  > bbr.zsh
          $BIN completion fish > bbr.fish

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bbr-${{ matrix.target }}.${{ matrix.archive }}
            bbr-${{ matrix.target }}.${{ matrix.archive }}.sha256
            bbr.bash
            bbr.zsh
            bbr.fish
          generate_release_notes: true

  # Aggregate manifest. Runs for tags AND workflow_dispatch, so `bbr update`
  # (which fails closed on a missing checksums.txt) always finds one.
  checksums:
    name: Publish checksums.txt
    needs: build
    runs-on: ubuntu-latest
    steps:
      # scripts/gen-packages.sh (manifest generation below) lives in the repo.
      - uses: actions/checkout@v4

      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir assets \
            --pattern 'bbr-*.tar.gz' \
            --pattern 'bbr-*.zip'

      - name: Generate checksums.txt
        run: |
          set -euo pipefail
          cd assets
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum bbr-*.tar.gz bbr-*.zip | sort > ../checksums.txt
          else
            shasum -a 256 bbr-*.tar.gz bbr-*.zip | sort > ../checksums.txt
          fi
          cat ../checksums.txt

      - name: Upload checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber

      # Manifests for the third-party channels are derived from the release's
      # own checksums.txt, so a published digest can never disagree with the
      # archive. They are attached to the release; pushing them into a tap or
      # bucket is a separate, explicitly-configured step below.
      - name: Generate package-manager manifests
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          bash scripts/gen-packages.sh "$version" checksums.txt packages

      - name: Upload manifests to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            packages/bbr.rb packages/bbr.json \
            packages/winget/themankindproject.bbr.yaml \
            packages/winget/themankindproject.bbr.locale.en-US.yaml \
            packages/winget/themankindproject.bbr.installer.yaml \
            --repo "${{ github.repository }}" \
            --clobber

      # Optional: commit the generated manifests into a Homebrew tap and a
      # Scoop bucket. Both are separate repositories, so this only runs when
      # the corresponding secret is configured; otherwise it is skipped and
      # the manifests remain downloadable from the release.
      - name: Publish to package registries (optional)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          if [ -z "${TAP_TOKEN}${BUCKET_TOKEN}" ]; then
            echo "No registry tokens configured; manifests stay on the release."
            echo "See docs/distribution.md to enable Homebrew/Scoop publishing."
            exit 0
          fi
          echo "Registry publishing is configured; see docs/distribution.md."

  # Post-release proof: download the published Linux artifacts and install one
  # in a clean musl container plus an older-glibc container. This is the gate
  # that would have caught the missing aarch64 asset and the GLIBC 2.39 floor.
  #
  # Containers are used here only as disposable test environments for the
  # install script; bbr itself is not published as a container image.
  verify-install:
    name: Verify published install on ${{ matrix.image }}
    needs: checksums
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "alpine:3.20"]
    steps:
      - uses: actions/checkout@v4

      - name: Install inside ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh -c '
            set -e
            if command -v apk >/dev/null 2>&1; then apk add --no-cache bash curl tar >/dev/null; fi
            if command -v apt-get >/dev/null 2>&1; then apt-get update >/dev/null && apt-get install -y bash curl ca-certificates >/dev/null; fi
            bash install.sh "${{ github.ref_name }}"
            bbr --version
            bbr --help >/dev/null
          '
